# Netlify configuration for SHC Library Portal

[build]
  # Static site - no build command needed
  publish = "."
  functions = "netlify/functions"

# Redirect config API to the function
[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200
  force = true

# Admin password check runs on the server
[[redirects]]
  from = "/api/admin-login"
  to = "/.netlify/functions/admin-login"
  status = 200
  force = true

# Short link for staff: yoursite.netlify.app/admin
[[redirects]]
  from = "/admin"
  to = "/?admin=enabled"
  status = 302
  force = true
